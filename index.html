<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soso’s Fantasy Realm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 9 9%22><text y=%228%22 font-size=%228%22>🎀</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#ff8fb8;--pd:#e0508a;--pl:#ffe3ee;--bg:#fff6fa;--t:#6a2a45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;color:var(--t);background:radial-gradient(#ffd0e2 1.5px,transparent 1.5px) 0 0/22px 22px,var(--bg);display:flex;justify-content:center;padding:16px 12px 40px}
main{width:100%;max-width:460px}
.card{background:#fff;border:3px dashed var(--p);border-radius:26px;padding:20px 16px;text-align:center;box-shadow:0 8px 24px #ff8fb855;margin-top:30px}
h1,h2{margin:.3em 0;color:var(--pd)}
.face{display:block;height:150px;width:auto;max-width:75%;object-fit:contain;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.face.sm{height:70px;animation:none;display:inline-block;vertical-align:middle}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.bub{background:var(--pl);border-radius:20px;padding:12px 14px;margin:12px 0;line-height:1.9;font-size:1.05rem}
button{font:inherit;border:0;border-radius:16px;padding:10px 16px;background:var(--p);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--pd)}
button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.55}
.opts{display:grid;gap:8px}.opts button.on{background:var(--pd)}
.go{margin-top:10px;background:var(--pd)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto;max-width:280px;direction:ltr}
.pad button{font-size:1.4rem;padding:12px 0}.pad .s{background:#ffb3cf;font-size:1rem}
input,textarea{width:100%;font:inherit;border:2px solid var(--p);border-radius:12px;padding:9px;margin:4px 0;color:var(--t);background:#fff}
#code{text-align:center;font-size:1.8rem;letter-spacing:.4em;max-width:200px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
details.gift{background:#fff;border:3px solid var(--p);border-radius:20px;margin:12px 0;box-shadow:0 5px 14px #ff8fb844}
details.gift>summary{cursor:pointer;padding:14px;font-weight:700;color:var(--pd);list-style:none;font-size:1.1rem}
details.gift>summary::-webkit-details-marker{display:none}
.gb{padding:4px 16px 18px;line-height:2;text-align:center}
.pre{white-space:pre-line;text-align:right}
.gb img,.gb iframe{max-width:100%;border-radius:16px}iframe{width:100%;aspect-ratio:16/9;border:0}
a.btn{display:inline-block;margin:8px 0;padding:9px 16px;border-radius:16px;background:var(--pd);color:#fff;text-decoration:none}
.flame{transform-origin:50% 100%;animation:fl .3s infinite alternate}@keyframes fl{to{transform:scale(1.12,.92)}}
.off .flame{display:none}
#mute{position:fixed;top:10px;left:10px;z-index:9;padding:8px 12px}
.fl{position:fixed;top:-30px;font-size:24px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#admin label{display:block;text-align:right;font-size:.85rem;margin-top:8px}
#admin details{text-align:right;border:2px solid var(--pl);border-radius:14px;padding:6px 10px;margin:8px 0}
#admin summary{cursor:pointer;font-weight:700;color:var(--pd)}
.ok{color:#2a8a4a}.er{color:#c0264f}
</style></head><body>
<button id="mute" title="الصوت">🔊</button>
<main id="app"></main>

letter:{title:"💌 رسالة إلى سوسو",body:"إلى سوسو… ساجدتي الغالية،\n\nفي مثل هذا اليوم، قبل عشرين عامًا، أهدت السماءُ الدنيا قلبًا طيّبًا يشبه الضوء حين يتسلّل من نافذة فجرٍ هادئ، فلم تعد الدنيا بعده كما كانت.\n\nوأنا اليوم، وأنتِ تعبرين عتبة العشرين، أعجز عن حصر ما تعنينه لي في سطور؛ فالصداقة الحقّة لا تُقاس بالسنين، بل بالأيادي التي تمتدّ إليكِ حين تتعثّرين، وبالضحكات التي تُنسيكِ ثِقل الأيام، وقد كنتِ ذلك كلَّه وأكثر.\n\nأرجو أن يكون عقدُكِ الجديد بستانًا تتفتّح فيه أحلامكِ واحدًا تلو الآخر، وأن يحفظ اللهُ قلبكِ من كل حزن، ويمنحكِ من الفرح ما يفيض على أيامكِ.\n\nكل عامٍ وأنتِ بخير يا سوسو، وكل عامٍ وقلبكِ وطنٌ لمن أحبّكِ.\n\nصديقتكِ التي تحبّكِ"},
song:{title:"🎵 أغنية: My Old Friend — Tim McGraw",text:"ليست الأغنية لحنًا عابرًا، بل رفٌّ صغير نحفظ عليه الذكريات. حين تسمعينها تذكّري أن الأصدقاء القدامى لا يرحلون؛ يبقون في الضحكة التي لا تُنسى، وفي الأسرار التي صانها الزمن، وفي كل طريقٍ مشيناه معًا. شغّليها واتركي قلبكِ يتذكّر.",url:"https://www.youtube.com/results?search_query=My+Old+Friend+Tim+McGraw",btn:"افتحي الأغنية 🎧",start:"0",len:"20"},
